<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chi Tiết Sản Phẩm</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

</head>

<body>

    <header class="bg-success text-white text-center py-4">
        <h1>Chi Tiết Sản Phẩm</h1>
    </header>

    <div class="container mt-4">

        <div class="row">

            <div class="col-md-6">
                <img id="productImage" class="img-fluid">
            </div>

            <div class="col-md-6">

                <h2 id="productName"></h2>

                <p id="productDesc"></p>

                <h4 id="productPrice"></h4>

                <br>

                <a href="index.html" class="btn btn-secondary">Quay Lại</a>

                <a href="index.html" class="btn btn-success">Tiếp Tục Mua Sắm</a>

            </div>

        </div>

    </div>


    <script>

        const params = new URLSearchParams(window.location.search);

        const id = params.get("id");

        const products = {

            1: {
                name: "Sản Phẩm 1",
                price: "Giá: $100",
                desc: "Mô tả sản phẩm 1",
                img: "https://picsum.photos/id/684/600/400"
            },

            2: {
                name: "Sản Phẩm 2",
                price: "Giá: $150",
                desc: "Mô tả sản phẩm 2",
                img: "https://picsum.photos/id/1025/600/400"
            },

            3: {
                name: "Sản Phẩm 3",
                price: "Giá: $120",
                desc: "Mô tả sản phẩm 3",
                img: "https://picsum.photos/id/1060/600/400"
            },

            4: {
                name: "Sản Phẩm 4",
                price: "Giá: $120",
                desc: "Mô tả sản phẩm 4",
                img: "https://picsum.photos/id/1011/600/400"
            },

            5: {
                name: "Sản Phẩm 5",
                price: "Giá: $120",
                desc: "Mô tả sản phẩm 5",
                img: "https://picsum.photos/id/1015/600/400"
            },

            6: {
                name: "Sản Phẩm 6",
                price: "Giá: $120",
                desc: "Mô tả sản phẩm 6",
                img: "https://picsum.photos/id/1020/600/400"
            }

        };

        const product = products[id];

        document.getElementById("productName").innerText = product.name;

        document.getElementById("productDesc").innerText = product.desc;

        document.getElementById("productPrice").innerText = product.price;

        document.getElementById("productImage").src = product.img;

    </script>

</body>

</html>
